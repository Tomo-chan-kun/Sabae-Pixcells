<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111d">
<title>Sabae Pixcell クライアントアプリ</title>
<style>
html,body{width:100%;height:100%;margin:0;background:#08111d;overflow:hidden}
iframe{display:block;width:100%;height:100%;border:0;background:#08111d}
</style>
</head>
<body>
<iframe id="app" src="../apps/Sabae_Pixcell_Earth_v001.html" allow="geolocation; autoplay; fullscreen" allowfullscreen></iframe>
<script>
const app=document.getElementById('app');
const TARGET_TITLE="Sabae Pixcell クライアントアプリ";
const ALIASES=["Sabae PixCell Earth","Sabae Pixcell Earth","Sabae Pixcells Earth","Earth v001"];
function esc(s){return s.replace(/[.*+?^$()|[\]{}\\]/g,'\\$&')}
function clean(doc){
  if(!doc||!doc.body)return;
  doc.title=TARGET_TITLE;
  const walker=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);
  let n;
  while((n=walker.nextNode())){
    const p=n.parentElement;
    if(!p||/^(SCRIPT|STYLE|NOSCRIPT|TEXTAREA)$/i.test(p.tagName))continue;
    let s=n.nodeValue||'';
    for(const a of ALIASES){
      s=s.replace(new RegExp(esc(a)+'(?:\\s+v\\d+(?:\\.\\d+)*)?','gi'),TARGET_TITLE);
    }
    s=s.replace(/\bv\d+(?:\.\d+)*\b/gi,'');
    s=s.replace(/current\s*:\s*/gi,'');
    n.nodeValue=s.replace(/\s{2,}/g,' ');
  }
  for(const el of doc.querySelectorAll('body *')){
    if(/^(SCRIPT|STYLE|NOSCRIPT|TEXTAREA)$/i.test(el.tagName))continue;
    const t=(el.textContent||'').trim();
    const k=((el.id||'')+' '+(typeof el.className==='string'?el.className:'')).toLowerCase();
    if(/^(更新情報|更新履歴|変更履歴|バージョン情報|version information|release notes?|changelog)\b/i.test(t)){
      el.style.display='none';
    }
    if(/(?:version|changelog|release[-_ ]?notes?|update[-_ ]?info)/i.test(k)&&/(?:v\d|version|バージョン|更新|release|変更履歴)/i.test(t)){
      el.style.display='none';
    }
  }
}
function run(){
  try{
    const d=app.contentDocument;
    clean(d);
    if(!d.__sabaeCleanObserver){
      const obs=new MutationObserver(()=>clean(d));
      obs.observe(d.body,{subtree:true,childList:true,characterData:true});
      d.__sabaeCleanObserver=obs;
    }
  }catch(e){}
}
app.addEventListener('load',run);
setInterval(run,2500);
</script>
</body>
</html>
