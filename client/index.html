<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111d">
<title>Sabae Pixcell クライアントアプリ</title>
<style>
html,body{width:100%;height:100%;margin:0;background:#08111d;overflow:hidden}
iframe{display:block;width:100%;height:100%;border:0;background:#08111d}
</style>
</head>
<body>
<iframe id="app" src="../apps/Sabae_Pixcell_Earth_v001.html" allow="geolocation; autoplay; fullscreen" allowfullscreen></iframe>
<script>
const app=document.getElementById('app');
const TARGET_TITLE="Sabae Pixcell クライアントアプリ";
const ALIASES=["Sabae PixCell Earth","Sabae Pixcell Earth","Sabae Pixcells Earth","Earth v001"];
function esc(s){return s.replace(/[.*+?^$()|[\]{}\\]/g,'\\$&')}
function clean(doc){
  if(!doc||!doc.body)return;
  doc.title=TARGET_TITLE;

  // バージョン番号だけの表示や、開発版の更新・改修メモは要素ごと非表示。
  for(const el of doc.querySelectorAll('body *')){
    if(/^(SCRIPT|STYLE|NOSCRIPT|TEXTAREA)$/i.test(el.tagName))continue;
    if(el.children.length)continue;
    const t=(el.textContent||'').trim();
    if(/^v\d+(?:\.\d+)*$/i.test(t) ||
       /(?:バージョン情報|更新情報|更新履歴|変更履歴|version information|release notes?|changelog)/i.test(t) ||
       (/\bv\d+(?:\.\d+)*\b/i.test(t) && /(?:映像完成版|改修|revision|build)/i.test(t))){
      el.style.display='none';
    }
  }

  // アプリの提出用名称へ置換。値が変わるときだけ書き換え、DOM監視ループを起こさない。
  const walker=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);
  let n;
  while((n=walker.nextNode())){
    const p=n.parentElement;
    if(!p||/^(SCRIPT|STYLE|NOSCRIPT|TEXTAREA)$/i.test(p.tagName))continue;
    const before=n.nodeValue||'';
    let after=before;
    for(const a of ALIASES){
      after=after.replace(new RegExp(esc(a)+'(?:\\s+v\\d+(?:\\.\\d+)*)?','gi'),TARGET_TITLE);
    }
    after=after.replace(/\bv\d+(?:\.\d+)*\b/gi,'');
    after=after.replace(/current\s*:\s*/gi,'');
    after=after.replace(/[ \t]{2,}/g,' ');
    if(after!==before)n.nodeValue=after;
  }
}
function run(){
  try{clean(app.contentDocument)}catch(e){}
}
app.addEventListener('load',()=>{
  run();
  // 初期描画後に一度だけ再確認。MutationObserverは使わず、アニメーションを阻害しない。
  setTimeout(run,400);
});
</script>
</body>
</html>
