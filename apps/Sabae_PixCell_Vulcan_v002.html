<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111318">
<title>Sabae PixCell Vulcan v002</title>
<style>
:root{
  --bg:#0b0d10;--panel:#14181f;--panel2:#1b2029;--line:#2a313d;
  --text:#f4f7fb;--muted:#aeb7c5;--accent:#ff8a35;--good:#54d889;--bad:#ff6470;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100vh}
button,input,select{font:inherit}
header{
  position:sticky;top:0;z-index:10;padding:12px 14px;background:rgba(11,13,16,.95);
  border-bottom:1px solid var(--line);backdrop-filter:blur(10px)
}
.brand{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.brand b{font-size:20px;letter-spacing:.2px}.brand span{color:var(--accent);font-weight:800}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
main{max-width:1000px;margin:auto;padding:12px;display:grid;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.card h2{font-size:14px;margin:0 0 10px;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--muted)}
input,select{
  width:100%;margin-top:5px;border:1px solid var(--line);background:#0e1116;color:var(--text);
  border-radius:9px;padding:10px
}
input[type="range"]{padding:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{
  border:1px solid var(--line);background:var(--panel2);color:var(--text);
  border-radius:10px;padding:10px 12px;font-weight:700
}
button.primary{background:var(--accent);color:#17100b;border-color:transparent}
button.danger{background:#3a171b;color:#ffd7db}
button:disabled{opacity:.45}
.status{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:#707987}
.dot.good{background:var(--good)}.dot.bad{background:var(--bad)}
.metric{background:#0e1116;border:1px solid var(--line);border-radius:10px;padding:9px}
.metric b{display:block;font-size:18px}.metric span{font-size:11px;color:var(--muted)}
#fieldWrap{position:relative;width:100%;aspect-ratio:1.12/1;min-height:280px}
canvas{width:100%;height:100%;display:block;background:#0b0e13;border:1px solid var(--line);border-radius:12px;touch-action:none}
.legend{font-size:11px;color:var(--muted);margin-top:7px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
pre{
  margin:0;max-height:210px;overflow:auto;white-space:pre-wrap;word-break:break-all;
  background:#0b0e13;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11px;color:#d6deea
}
.small{font-size:11px;color:var(--muted)}
.warn{color:#ffd18f}
@media(max-width:700px){
  .grid,.grid3{grid-template-columns:1fr}
  #fieldWrap{min-height:330px}
}
</style>
</head>
<body>
<header>
  <div class="brand"><b>Sabae PixCell <span>Vulcan</span></b><small>v002</small></div>
  <div class="sub">仮想端末エミュレーター / Virtual Device Emulator</div>
</header>

<main>
  <section class="card">
    <h2>1. Sun 接続</h2>
    <div class="grid">
      <label>WebSocket URL
        <input id="wsUrl" value="ws://192.168.1.100:8765/device" autocomplete="off" autocapitalize="off">
      </label>
      <label>送信周期
        <select id="interval">
          <option value="50">50 ms</option>
          <option value="100" selected>100 ms</option>
          <option value="200">200 ms</option>
          <option value="500">500 ms</option>
          <option value="1000">1000 ms</option>
        </select>
      </label>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="primary" id="connectBtn">接続</button>
      <button class="danger" id="disconnectBtn" disabled>切断</button>
      <div class="status"><span id="connDot" class="dot"></span><span id="connText" class="small">未接続</span></div>
    </div>
  </section>

  <section class="card">
    <h2>2. 仮想端末</h2>
    <div class="grid3">
      <label>端末ID 接頭辞
        <input id="prefix" value="VULCAN">
      </label>
      <label>仮想端末数
        <input id="deviceCount" type="number" min="1" max="5000" value="1">
      </label>
      <label>接続方式
        <select id="socketMode">
          <option value="mux" selected>1接続に多重化</option>
          <option value="multi">端末ごとに個別接続</option>
        </select>
      </label>
    </div>
    <div class="small warn" style="margin-top:8px">最大5000仮想端末は多重化モードで試験してください。個別接続モードはブラウザ負荷が大きいため200接続までに制限します。</div>
  </section>

  <section class="card">
    <h2>3. ビーコン配置・RSSIモデル</h2>
    <div class="grid3">
      <label>正三角形 一辺
        <input id="side" type="number" min="0.5" max="100" step="0.1" value="3.0">
      </label>
      <label>1 m 基準RSSI
        <input id="txPower" type="number" min="-100" max="-20" value="-59">
      </label>
      <label>経路損失指数 n
        <input id="pathLoss" type="number" min="1" max="6" step="0.1" value="2.2">
      </label>
    </div>
    <div class="grid" style="margin-top:10px">
      <label>RSSIノイズ σ
        <input id="noise" type="number" min="0" max="20" step="0.1" value="2.0">
      </label>
      <label>複数端末の配置
        <select id="distribution">
          <option value="same">同一点</option>
          <option value="random" selected>三角形内にランダム</option>
          <option value="grid">三角形内に格子状</option>
        </select>
      </label>
    </div>
  </section>

  <section class="card">
    <h2>4. 仮想位置</h2>
    <div id="fieldWrap"><canvas id="field"></canvas></div>
    <div class="legend">A=赤 / B=青 / C=緑。橙点が基準仮想端末。ドラッグで移動できます。</div>

    <div class="grid" style="margin-top:10px">
      <label>X位置 <span id="xVal" class="mono"></span>
        <input id="x" type="range" min="0" max="3" step="0.01" value="1.5">
      </label>
      <label>Y位置 <span id="yVal" class="mono"></span>
        <input id="y" type="range" min="0" max="2.598" step="0.01" value="0.9">
      </label>
    </div>

    <div class="grid3" style="margin-top:10px">
      <label>移動モード
        <select id="motion">
          <option value="fixed" selected>固定</option>
          <option value="horizontal">左右往復</option>
          <option value="circle">円運動</option>
          <option value="randomwalk">ランダムウォーク</option>
        </select>
      </label>
      <label>速度
        <input id="speed" type="number" min="0.05" max="10" step="0.05" value="0.5">
      </label>
      <label>位置ヒントを送信
        <select id="sendHint">
          <option value="yes" selected>送る（検証用）</option>
          <option value="no">送らない</option>
        </select>
      </label>
    </div>
  </section>

  <section class="card">
    <h2>5. エミュレーション</h2>
    <div class="row">
      <button class="primary" id="startBtn">送信開始</button>
      <button id="stopBtn" disabled>停止</button>
      <button id="oneShotBtn">1回送信</button>
    </div>

    <div class="grid3" style="margin-top:10px">
      <div class="metric"><b id="activeDevices">0</b><span>仮想端末</span></div>
      <div class="metric"><b id="sentCount">0</b><span>送信端末データ</span></div>
      <div class="metric"><b id="sendRate">0</b><span>端末データ/s</span></div>
    </div>
  </section>

  <section class="card">
    <h2>送信プレビュー</h2>
    <pre id="preview">{}</pre>
  </section>
</main>

<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);
const els = {
  wsUrl:$('wsUrl'), interval:$('interval'), connectBtn:$('connectBtn'), disconnectBtn:$('disconnectBtn'),
  connDot:$('connDot'), connText:$('connText'), prefix:$('prefix'), deviceCount:$('deviceCount'),
  socketMode:$('socketMode'), side:$('side'), txPower:$('txPower'), pathLoss:$('pathLoss'), noise:$('noise'),
  distribution:$('distribution'), field:$('field'), x:$('x'), y:$('y'), xVal:$('xVal'), yVal:$('yVal'),
  motion:$('motion'), speed:$('speed'), sendHint:$('sendHint'), startBtn:$('startBtn'), stopBtn:$('stopBtn'),
  oneShotBtn:$('oneShotBtn'), activeDevices:$('activeDevices'), sentCount:$('sentCount'), sendRate:$('sendRate'),
  preview:$('preview')
};

let sockets = [];
let running = false;
let timer = null;
let seq = 0;
let sent = 0;
let sentWindow = 0;
let rateTimer = null;
let devices = [];
let lastTick = performance.now();
let dragging = false;

function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function randn(){
  let u=0,v=0;
  while(u===0) u=Math.random();
  while(v===0) v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}
function side(){ return Math.max(.5, Number(els.side.value)||3); }
function triH(){ return side()*Math.sqrt(3)/2; }
function beacons(){
  const s=side(), h=triH();
  return [
    {id:'A', role:'red',   x:0,   y:0},
    {id:'B', role:'blue',  x:s,   y:0},
    {id:'C', role:'green', x:s/2, y:h}
  ];
}
function pointInTriangle(x,y){
  const s=side(), h=triH();
  if(y<0 || y>h || x<0 || x>s) return false;
  const left = (s/2)*(y/h);
  const right = s-left;
  return x>=left && x<=right;
}
function keepInside(p){
  const s=side(), h=triH();
  p.y = clamp(p.y,0,h);
  const left = (s/2)*(p.y/h || 0);
  const right = s-left;
  p.x = clamp(p.x,left,right);
  return p;
}
function randomPoint(){
  let r1=Math.sqrt(Math.random()), r2=Math.random();
  const A={x:0,y:0}, B={x:side(),y:0}, C={x:side()/2,y:triH()};
  return {
    x:(1-r1)*A.x + r1*(1-r2)*B.x + r1*r2*C.x,
    y:(1-r1)*A.y + r1*(1-r2)*B.y + r1*r2*C.y
  };
}
function gridPoints(n){
  const pts=[], rows=Math.max(1,Math.ceil(Math.sqrt(n)));
  const h=triH(), s=side();
  for(let r=0;r<rows && pts.length<n;r++){
    const y=h*(r+.7)/(rows+0.4);
    const left=(s/2)*(y/h), right=s-left;
    const cols=Math.max(1,Math.ceil((n-pts.length)/(rows-r)));
    for(let c=0;c<cols && pts.length<n;c++){
      pts.push({x:left+(right-left)*(c+.5)/cols,y});
    }
  }
  while(pts.length<n) pts.push(randomPoint());
  return pts;
}
function syncRanges(){
  const s=side(), h=triH();
  els.x.max=s.toFixed(3); els.y.max=h.toFixed(3);
  let p={x:Number(els.x.value),y:Number(els.y.value)};
  keepInside(p);
  els.x.value=p.x; els.y.value=p.y;
  els.xVal.textContent=Number(els.x.value).toFixed(2)+' m';
  els.yVal.textContent=Number(els.y.value).toFixed(2)+' m';
}
function buildDevices(){
  const n=clamp(parseInt(els.deviceCount.value)||1,1,5000);
  els.deviceCount.value=n;
  const base=keepInside({x:Number(els.x.value),y:Number(els.y.value)});
  let pts=[];
  if(els.distribution.value==='same') pts=Array.from({length:n},()=>({x:base.x,y:base.y}));
  else if(els.distribution.value==='grid') pts=gridPoints(n);
  else pts=Array.from({length:n},()=>randomPoint());

  devices=pts.map((p,i)=>({
    id:`${(els.prefix.value||'VULCAN').trim()}-${String(i+1).padStart(3,'0')}`,
    x:p.x,y:p.y,baseX:p.x,baseY:p.y,phase:(i/n)*Math.PI*2,heading:Math.random()*Math.PI*2
  }));
  if(n===1){ devices[0].x=base.x;devices[0].y=base.y;devices[0].baseX=base.x;devices[0].baseY=base.y; }
  els.activeDevices.textContent=devices.length;
  draw();
}
function rssiFor(p,b){
  const dx=p.x-b.x, dy=p.y-b.y;
  const d=Math.max(.05,Math.hypot(dx,dy));
  const tx=Number(els.txPower.value)||-59;
  const n=Number(els.pathLoss.value)||2.2;
  const sigma=Math.max(0,Number(els.noise.value)||0);
  return Math.round(clamp(tx - 10*n*Math.log10(d) + randn()*sigma,-110,-20));
}
function payloadFor(d){
  const bs=beacons();
  const packet={
    type:'pixcell-rssi',
    protocol:'sabae-pixcell/1',
    source:'vulcan',
    deviceId:d.id,
    seq:++seq,
    measurementId:`${d.id}:${seq}`,
    clientTimeMs:Date.now(),
    rssi:{
      A:rssiFor(d,bs[0]),
      B:rssiFor(d,bs[1]),
      C:rssiFor(d,bs[2])
    }
  };
  if(els.sendHint.value==='yes'){
    packet.positionHint={x:+d.x.toFixed(3), y:+d.y.toFixed(3), unit:'m'};
  }
  return packet;
}
function socketOpen(ws){ return ws && ws.readyState===WebSocket.OPEN; }
function setConn(state,text){
  els.connDot.className='dot'+(state==='good'?' good':state==='bad'?' bad':'');
  els.connText.textContent=text;
}
async function connect(){
  disconnect();
  const url=els.wsUrl.value.trim();
  if(!url){setConn('bad','URL未入力');return}
  buildDevices();
  const mode=els.socketMode.value;
  if(mode==='multi' && devices.length>200){
    setConn('bad','個別接続は200台まで。5000台試験は「1接続に多重化」を使用してください');
    return;
  }
  const count=mode==='multi'?devices.length:1;
  setConn('',`接続中 0/${count}`);
  let opened=0, failed=0;
  for(let i=0;i<count;i++){
    try{
      const ws=new WebSocket(url);
      ws._deviceIndex=i;
      ws.onopen=()=>{
        opened++;
        setConn('good',`接続 ${opened}/${count}`);
        els.connectBtn.disabled=true; els.disconnectBtn.disabled=false;
      };
      ws.onerror=()=>{ failed++; if(opened===0) setConn('bad',`接続失敗 ${failed}/${count}`); };
      ws.onclose=()=>{
        const alive=sockets.filter(socketOpen).length;
        if(alive===0){setConn('','未接続');els.connectBtn.disabled=false;els.disconnectBtn.disabled=true;}
        else setConn('good',`接続 ${alive}/${count}`);
      };
      sockets.push(ws);
      if(i%25===24) await new Promise(r=>setTimeout(r,20));
    }catch(e){
      failed++;
      setConn('bad','接続エラー: '+e.message);
    }
  }
}
function disconnect(){
  stop();
  for(const ws of sockets){ try{ws.close();}catch(_){} }
  sockets=[];
  els.connectBtn.disabled=false; els.disconnectBtn.disabled=true;
  setConn('','未接続');
}
function sendPacket(packet,deviceIndex){
  const text=JSON.stringify(packet);
  let ws;
  if(els.socketMode.value==='multi') ws=sockets[0];
  else ws=sockets[deviceIndex];
  if(socketOpen(ws)){
    try{ws.send(text);sent++;sentWindow++;return true}catch(_){}
  }
  return false;
}
function sendOnce(){
  if(devices.length!==Number(els.deviceCount.value)) buildDevices();
  let last=null;
  if(els.socketMode.value==='mux'){
    const packets=devices.map(d=>payloadFor(d));
    last=packets[packets.length-1]||null;
    const ws=sockets[0];
    if(socketOpen(ws)){
      try{
        ws.send(JSON.stringify({type:'pixcell-rssi-batch',protocol:'sabae-pixcell/1',source:'vulcan',packets}));
        sent+=packets.length; sentWindow+=packets.length;
      }catch(_){}
    }
  }else{
    devices.forEach((d,i)=>{ const p=payloadFor(d); sendPacket(p,i); last=p; });
  }
  if(last) els.preview.textContent=JSON.stringify(last,null,2);
  els.sentCount.textContent=sent;
}
function moveDevices(dt){
  const mode=els.motion.value;
  if(mode==='fixed') return;
  const sp=Math.max(.01,Number(els.speed.value)||.5), s=side(), h=triH();
  const t=performance.now()/1000;
  devices.forEach((d,i)=>{
    if(mode==='horizontal'){
      const y=clamp(d.baseY,0,h);
      const left=(s/2)*(y/h||0), right=s-left;
      const span=Math.max(.05,right-left);
      const u=(Math.sin(t*sp*Math.PI*2/span+d.phase)+1)/2;
      d.x=left+span*u; d.y=y;
    }else if(mode==='circle'){
      const cx=s/2, cy=h/3, r=Math.min(s,h)*.22;
      d.x=cx+r*Math.cos(t*sp+d.phase); d.y=cy+r*Math.sin(t*sp+d.phase);
      keepInside(d);
    }else if(mode==='randomwalk'){
      d.heading += randn()*.8*Math.sqrt(dt);
      d.x += Math.cos(d.heading)*sp*dt;
      d.y += Math.sin(d.heading)*sp*dt;
      const before={x:d.x,y:d.y};
      keepInside(d);
      if(before.x!==d.x || before.y!==d.y) d.heading += Math.PI*.75+Math.random()*Math.PI*.5;
    }
  });
}
function tick(){
  const now=performance.now(),dt=Math.min(.5,(now-lastTick)/1000);lastTick=now;
  moveDevices(dt); sendOnce(); draw();
}
function start(){
  buildDevices();
  if(running) return;
  running=true; lastTick=performance.now();
  const ms=Math.max(20,Number(els.interval.value)||100);
  timer=setInterval(tick,ms);
  els.startBtn.disabled=true;els.stopBtn.disabled=false;
}
function stop(){
  running=false;
  if(timer){clearInterval(timer);timer=null}
  els.startBtn.disabled=false;els.stopBtn.disabled=true;
}
function resizeCanvas(){
  const c=els.field, rect=c.getBoundingClientRect(), dpr=Math.min(devicePixelRatio||1,2);
  c.width=Math.max(1,Math.floor(rect.width*dpr));
  c.height=Math.max(1,Math.floor(rect.height*dpr));
  draw();
}
function transform(){
  const c=els.field, pad=36*(c.width/c.getBoundingClientRect().width);
  const s=side(),h=triH();
  const sx=(c.width-pad*2)/s, sy=(c.height-pad*2)/h, sc=Math.min(sx,sy);
  const ox=(c.width-s*sc)/2, oy=(c.height-h*sc)/2;
  return {sc,ox,oy,toPx:(x,y)=>({x:ox+x*sc,y:c.height-(oy+y*sc)}),
    toWorld:(px,py)=>({x:(px-ox)/sc,y:(c.height-py-oy)/sc})};
}
function draw(){
  const c=els.field,ctx=c.getContext('2d');
  if(!ctx||!c.width)return;
  ctx.clearRect(0,0,c.width,c.height);
  const tr=transform(),bs=beacons(), A=tr.toPx(bs[0].x,bs[0].y),B=tr.toPx(bs[1].x,bs[1].y),C=tr.toPx(bs[2].x,bs[2].y);
  ctx.lineWidth=Math.max(2,c.width/350);ctx.strokeStyle='#485364';ctx.fillStyle='#10141b';
  ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.lineTo(C.x,C.y);ctx.closePath();ctx.fill();ctx.stroke();

  const cols=['#ff4f5e','#4d8cff','#4ed97c'];
  bs.forEach((b,i)=>{
    const p=tr.toPx(b.x,b.y);
    ctx.beginPath();ctx.fillStyle=cols[i];ctx.arc(p.x,p.y,10*(c.width/c.getBoundingClientRect().width),0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.font=`${12*(c.width/c.getBoundingClientRect().width)}px system-ui`;ctx.fillText(b.id,p.x+12,p.y-10);
  });

  const maxDraw=250;
  for(let i=0;i<Math.min(devices.length,maxDraw);i++){
    const d=devices[i],p=tr.toPx(d.x,d.y);
    ctx.beginPath();ctx.fillStyle=i===0?'#ff9b45':'rgba(255,155,69,.55)';
    ctx.arc(p.x,p.y,(i===0?7:3.5)*(c.width/c.getBoundingClientRect().width),0,Math.PI*2);ctx.fill();
  }
  if(devices.length>maxDraw){
    ctx.fillStyle='#d9e1ec';ctx.font=`${12*(c.width/c.getBoundingClientRect().width)}px system-ui`;
    ctx.fillText(`表示 ${maxDraw}/${devices.length} 台`,12,20);
  }
}
function pointerWorld(ev){
  const r=els.field.getBoundingClientRect(), dpr=els.field.width/r.width;
  return transform().toWorld((ev.clientX-r.left)*dpr,(ev.clientY-r.top)*dpr);
}
function setBaseFromPointer(ev){
  let p=pointerWorld(ev);keepInside(p);
  els.x.value=p.x;els.y.value=p.y;syncRanges();
  if(devices.length===1){devices[0].x=p.x;devices[0].y=p.y;devices[0].baseX=p.x;devices[0].baseY=p.y}
  else if(els.distribution.value==='same') buildDevices();
  draw();
}

els.connectBtn.onclick=connect;
els.disconnectBtn.onclick=disconnect;
els.startBtn.onclick=start;
els.stopBtn.onclick=stop;
els.oneShotBtn.onclick=()=>{ if(!devices.length)buildDevices(); sendOnce(); draw(); };
els.side.oninput=()=>{syncRanges();buildDevices()};
els.x.oninput=()=>{syncRanges(); if(devices.length===1||els.distribution.value==='same')buildDevices();};
els.y.oninput=()=>{syncRanges(); if(devices.length===1||els.distribution.value==='same')buildDevices();};
['deviceCount','distribution','prefix'].forEach(id=>$(id).onchange=buildDevices);
els.field.addEventListener('pointerdown',e=>{dragging=true;els.field.setPointerCapture(e.pointerId);setBaseFromPointer(e)});
els.field.addEventListener('pointermove',e=>{if(dragging)setBaseFromPointer(e)});
els.field.addEventListener('pointerup',()=>dragging=false);
els.field.addEventListener('pointercancel',()=>dragging=false);
window.addEventListener('resize',resizeCanvas);

rateTimer=setInterval(()=>{els.sendRate.textContent=sentWindow;sentWindow=0},1000);
syncRanges();buildDevices();
requestAnimationFrame(resizeCanvas);
})();
</script>
</body>
</html>
