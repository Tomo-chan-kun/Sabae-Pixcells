<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000"><title>Sabae PixCell Earth v001</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#light{position:fixed;inset:0;background:#000;transition:background-color .035s linear}
#top{position:fixed;left:10px;right:10px;top:10px;z-index:5;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.badge{background:rgba(0,0,0,.55);backdrop-filter:blur(5px);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 9px;font-size:11px}
#bottom{position:fixed;left:10px;right:10px;bottom:10px;z-index:5;background:rgba(0,0,0,.60);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:8px}
#bottom .line{display:flex;justify-content:space-between;gap:10px;font-size:11px}
#settings{position:fixed;inset:0;z-index:10;background:#0c1016;color:#f5f7fb;padding:14px;overflow:auto;transform:translateY(100%);transition:transform .2s ease}
#settings.open{transform:translateY(0)}
h1{font-size:18px;margin:0 0 4px}small{color:#aeb7c6}label{display:block;font-size:12px;color:#aeb7c6;margin-top:12px}input{width:100%;padding:10px;margin-top:5px;border:1px solid #2c3746;border-radius:9px;background:#121923;color:#fff}
button{padding:10px 12px;border:1px solid #2c3746;border-radius:10px;background:#172130;color:#fff;font-weight:700}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#gear{position:fixed;right:10px;bottom:74px;z-index:7;border-radius:50%;width:44px;height:44px;padding:0}
</style>
</head><body>
<div id="light"></div>
<div id="top"><div class="badge" id="conn">Sun: 未接続</div><div class="badge" id="idBadge"></div></div>
<button id="gear">⚙</button>
<div id="bottom">
  <div class="line"><span>RSSI A <b id="a">—</b></span><span>B <b id="b">—</b></span><span>C <b id="c">—</b></span></div>
  <div class="line" style="margin-top:4px"><span>RSSI取得→発色 <b id="delay">—</b></span><span id="seq">seq 0</span></div>
</div>
<div id="settings">
  <h1>Sabae PixCell Earth <small>v001</small></h1><small>発光用</small>
  <label>Sun Server<input id="url" value="ws://192.168.1.100:8765/device"></label>
  <div class="row"><button id="connect">接続</button><button id="close">閉じる</button></div>
  <label>テストRSSI A<input id="ra" type="range" min="-100" max="-20" value="-60"></label>
  <label>テストRSSI B<input id="rb" type="range" min="-100" max="-20" value="-70"></label>
  <label>テストRSSI C<input id="rc" type="range" min="-100" max="-20" value="-75"></label>
  <div class="row"><button id="send">テストRSSI送信</button><button id="black">画面消灯</button></div>
  <p><small>実機BLE受信はAndroid側から <span style="font-family:monospace">window.SabaePixCellEarth.pushRssi(A,B,C,measurementId,scanMonoMs)</span> を呼び出す構成です。個人識別用の端末固有IDは使用せず、このページを開いている間だけのランダムIDを使います。</small></p>
</div>
<script>
(()=>{
'use strict';const $=id=>document.getElementById(id);
const E={light:$('light'),conn:$('conn'),idBadge:$('idBadge'),gear:$('gear'),bottom:$('bottom'),settings:$('settings'),url:$('url'),connect:$('connect'),close:$('close'),ra:$('ra'),rb:$('rb'),rc:$('rc'),send:$('send'),black:$('black'),a:$('a'),b:$('b'),c:$('c'),delay:$('delay'),seq:$('seq')};
const sessionId='EARTH-'+crypto.getRandomValues(new Uint32Array(2)).reduce((s,n)=>s+n.toString(36),'').slice(0,12).toUpperCase();
E.idBadge.textContent=sessionId;let ws=null,seq=0,lastMeasurements=new Map();
function connect(){try{ws&&ws.close()}catch(_){};try{ws=new WebSocket(E.url.value.trim());ws.onopen=()=>{E.conn.textContent='Sun: 接続済み';send({type:'device-hello',protocol:'sabae-pixcell/1',source:'earth',deviceId:sessionId,appVersion:'001',os:navigator.userAgent.includes('Android')?'Android':'Other'});E.settings.classList.remove('open')};ws.onclose=()=>E.conn.textContent='Sun: 未接続';ws.onerror=()=>E.conn.textContent='Sun: エラー';ws.onmessage=e=>onCommand(e.data)}catch(err){E.conn.textContent='Sun: 接続失敗'}}
function send(o){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(o))}
function pushRssi(A,B,C,measurementId,scanMonoMs){
  const mid=measurementId||`${sessionId}:${++seq}`;const localStart=performance.now();lastMeasurements.set(mid,localStart);
  E.a.textContent=A;E.b.textContent=B;E.c.textContent=C;E.seq.textContent='seq '+seq;
  send({type:'pixcell-rssi',protocol:'sabae-pixcell/1',source:'earth',deviceId:sessionId,seq,measurementId:mid,clientTimeMs:Date.now(),rssi:{A:+A,B:+B,C:+C}});
}
function setColor(color,measurementId){
  E.light.style.backgroundColor=color||'#000';
  const start=measurementId&&lastMeasurements.get(measurementId);
  if(start!=null){const d=performance.now()-start;E.delay.textContent=d.toFixed(1)+' ms';lastMeasurements.delete(measurementId)}
}
function onCommand(raw){let m;try{m=JSON.parse(raw)}catch(_){return};if(m.type!=='sun-command')return;
  if(m.command==='color')setColor(m.color||'#000',m.measurementId);
  if(m.command==='flash'){const before=E.light.style.backgroundColor||'#000';setColor(m.color||'#fff',m.measurementId);setTimeout(()=>E.light.style.backgroundColor=before,Math.max(10,+m.durationMs||200))}
}
window.SabaePixCellEarth={pushRssi,setColor,sessionId};
E.gear.onclick=()=>E.settings.classList.add('open');E.close.onclick=()=>E.settings.classList.remove('open');E.connect.onclick=connect;E.send.onclick=()=>pushRssi(+E.ra.value,+E.rb.value,+E.rc.value);E.black.onclick=()=>setColor('#000');
window.addEventListener('beforeunload',()=>{try{ws&&ws.close()}catch(_){}});E.settings.classList.add('open');
})();
</script></body></html>
