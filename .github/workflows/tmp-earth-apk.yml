name: Temporary Earth APK Build
on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 SDK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Reconstruct Earth project
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib, string
          parts=[pathlib.Path(f"tmp-earth-apk/parts/{n}").read_text().strip() for n in ("00","01","02")]
          s="".join(parts)
          alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"
          positions=[len(parts[0]), len(parts[0])+len(parts[1])]
          candidates=[s]
          for pos in positions:
              for ch in alphabet:
                  candidates.append(s[:pos]+ch+s[pos:])
          ok=None
          for c in candidates:
              try:
                  raw=base64.b64decode(c, validate=True)
                  gzip.decompress(raw)
                  ok=raw
                  break
              except Exception:
                  pass
          if ok is None:
              raise SystemExit("Could not repair base64 project archive")
          pathlib.Path("/tmp/earth_project.tar.gz").write_bytes(ok)
          print("Recovered archive bytes:", len(ok))
          PY
          tar -xzf /tmp/earth_project.tar.gz
          test -f Sabae_Pixcells_Earth_v001_LATEST/settings.gradle
          test -f Sabae_Pixcells_Earth_v001_LATEST/app/build.gradle

      - name: Build debug APK
        working-directory: Sabae_Pixcells_Earth_v001_LATEST
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          cp Sabae_Pixcells_Earth_v001_LATEST/app/build/outputs/apk/debug/app-debug.apk Sabae_Pixcells_Earth_v001.apk
          ls -lh Sabae_Pixcells_Earth_v001.apk
          sha256sum Sabae_Pixcells_Earth_v001.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sabae_Pixcells_Earth_v001_APK
          path: Sabae_Pixcells_Earth_v001.apk
          if-no-files-found: error
          retention-days: 1
