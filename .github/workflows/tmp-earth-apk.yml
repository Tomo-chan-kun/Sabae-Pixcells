name: Temporary Earth APK Build
on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 SDK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Reconstruct Earth project
        shell: bash
        run: |
          cat tmp-earth-apk/parts2/00 tmp-earth-apk/parts2/01 tmp-earth-apk/parts2/02 tmp-earth-apk/parts2/03 > /tmp/earth_project.tar.gz.b64
          base64 -d /tmp/earth_project.tar.gz.b64 > /tmp/earth_project.tar.gz
          gzip -t /tmp/earth_project.tar.gz
          tar -xzf /tmp/earth_project.tar.gz
          test -f Sabae_Pixcells_Earth_v001_LATEST/settings.gradle
          test -f Sabae_Pixcells_Earth_v001_LATEST/app/build.gradle

      - name: Apply corrected Moon-style 10 degree fireworks pre-warp
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("Sabae_Pixcells_Earth_v001_LATEST/app/src/main/java/jp/sabaepixcells/earth/Effects.java")
          s=p.read_text()
          pattern=r'''\s*(?:double sampleX=[^;]+;\s*)?double dist=Math\.hypot\([^;]+;\s*double radius=4\.0\+age\*17\.5, width=1\.6\+age\*0\.9;'''
          new='''\n                double sn=Math.sin(Math.toRadians(10.0));
                double q=0.80;
                double sampleX=xy[0]*sn;
                double sampleY=xy[1];
                double centerX=c[0]*q*sn;
                double centerY=c[1]*q*sn;
                double dist=Math.hypot(sampleX-centerX,sampleY-centerY);
                double radius=(4.0+age*17.5)*q*sn;
                double width=Math.max(0.85,(1.6+age*0.9)*q*sn*2.2);'''
          s2,n=re.subn(pattern,new,s,count=1)
          if n!=1:
              raise SystemExit(f"fireworks fragment replacement count={n}")
          p.write_text(s2)
          PY

      - name: Build debug APK
        working-directory: Sabae_Pixcells_Earth_v001_LATEST
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          cp Sabae_Pixcells_Earth_v001_LATEST/app/build/outputs/apk/debug/app-debug.apk Sabae_Pixcells_Earth_v001.apk
          ls -lh Sabae_Pixcells_Earth_v001.apk
          sha256sum Sabae_Pixcells_Earth_v001.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sabae_Pixcells_Earth_v001_APK
          path: Sabae_Pixcells_Earth_v001.apk
          if-no-files-found: error
          retention-days: 1
