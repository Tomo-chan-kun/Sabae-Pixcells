name: Build Earth APK

on:
  push:
    branches:
      - earth-apk-build
    paths:
      - 'earth-apk/**'
      - '.github/workflows/build-earth-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: earth-apk
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp earth-apk/app/build/outputs/apk/debug/app-debug.apk out/Sabae_Pixcells_Earth_v001.apk
          sha256sum out/Sabae_Pixcells_Earth_v001.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sabae-Pixcells-Earth-v001-APK
          path: out/Sabae_Pixcells_Earth_v001.apk
          if-no-files-found: error
          retention-days: 7
