name: Build Earth APK

on:
  push:
    branches:
      - earth-apk-build
    paths:
      - 'earth-apk/**'
      - '.github/workflows/build-earth-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and install Android SDK 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDKROOT" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDKROOT"
            find /usr/local/lib/android -maxdepth 5 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$SDKROOT" > earth-apk/local.properties

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: earth-apk
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp earth-apk/app/build/outputs/apk/debug/app-debug.apk out/Sabae_Pixcells_Earth_v001.apk
          sha256sum out/Sabae_Pixcells_Earth_v001.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sabae-Pixcells-Earth-v001-APK
          path: out/Sabae_Pixcells_Earth_v001.apk
          if-no-files-found: error
          retention-days: 7
