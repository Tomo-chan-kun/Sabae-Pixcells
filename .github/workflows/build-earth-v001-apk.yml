name: Build Earth APK v001
on:
  push:
    branches:
      - earth-apk-build-v001-20260922
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore Earth project
        shell: bash
        run: |
          cat > earth_project.b64 <<'EARTH_B64'
[... ELLIPSIZATION ...]
EARTH_B64
          base64 -d earth_project.b64 | tar -xzf -

      - name: Build debug APK
        working-directory: earth_apk_project
        shell: bash
        run: |
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Sabae_Pixcells_Earth_v001.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sabae_Pixcells_Earth_v001_APK
          path: Sabae_Pixcells_Earth_v001.apk
          retention-days: 3
